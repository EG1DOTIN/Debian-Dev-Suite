# ==============================================================================
# ~/.tmux.conf — Aesthetic & Ergonomic Configuration for Debian-Dev-Suite
# ==============================================================================

# --- General Settings ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
set -g focus-events on
set -g history-limit 10000

# --- Prefix Key (Allow both Ctrl+B and Ctrl+A) ---
set -g prefix C-b
set -g prefix2 C-a
bind C-a send-prefix -2

# --- 1-Based Indexing (Easier keyboard reach) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Mouse Support (Scroll, click to focus, drag to resize) ---
set -g mouse on

# --- Ergonomic Window & Pane Splitting ---
# Split horizontally with -
bind - split-window -v -c "#{pane_current_path}"
# Split vertically with | or \
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# --- Vim-Style Pane Navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing (Prefix + Alt + Arrow) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Quick Reload Shortcut (Prefix + r) ---
bind r source-file ~/.tmux.conf \; display-message "  ✔ ~/.tmux.conf reloaded successfully!"

# --- Clean, Minimalist Dark Status Bar ---
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Session name badge
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] ❐ #S #[bg=default,fg=default] "

# Right status: Hostname & Clock
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#89b4fa,bold]%H:%M "

# Active window tab
setw -g window-status-current-style "bg=#fab387,fg=#11111b,bold"
setw -g window-status-current-format " #I: #W "

# Inactive window tab
setw -g window-status-style "bg=#313244,fg=#a6adc8"
setw -g window-status-format " #I: #W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
