<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="50%" stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89dceb"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2"/>

  <!-- Sun rays -->
  <g stroke="url(#sunGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="18" x2="64" y2="25"/>
    <line x1="64" y1="71" x2="64" y2="78"/>
    <line x1="36" y1="46" x2="43" y2="46"/>
    <line x1="85" y1="46" x2="92" y2="46"/>
    <line x1="44" y1="26" x2="49" y2="31"/>
    <line x1="79" y1="61" x2="84" y2="66"/>
    <line x1="44" y1="66" x2="49" y2="61"/>
    <line x1="79" y1="31" x2="84" y2="26"/>
  </g>

  <!-- Center Sun Core with Night Glow Arc -->
  <circle cx="64" cy="46" r="16" fill="url(#sunGrad)"/>
  <!-- Subtle Moon Crescent accent overlay -->
  <path d="M 64 33 A 13 13 0 0 1 74 53 A 15 15 0 0 0 64 33 Z" fill="url(#moonGrad)" opacity="0.75"/>

  <!-- Brightness Slider Track -->
  <rect x="24" y="92" width="80" height="8" rx="4" fill="#313244"/>
  <rect x="24" y="92" width="52" height="8" rx="4" fill="url(#sliderGrad)"/>

  <!-- Slider Thumb / Knob -->
  <circle cx="76" cy="96" r="8" fill="#cdd6f4" stroke="#89b4fa" stroke-width="2.5"/>
</svg>
