-- ==============================================================================
-- ADVANCED DETAILED CONKY SYSTEM MONITOR
-- Generated automatically by Setup-Detailed-Conky.sh
-- Display Zoom Profile: Large (Full 1080p Height 385px)
-- ==============================================================================
-- System Hardware Mapping:
--  - Battery: BAT1 | AC Adapter: ACAD
--  - CPU Module: coretemp (8 logical threads detected)
--  - NVMe Module: nvme
--  - Chipset Module: acpitz
--  - WiFi Interface: wlan0 | Ethernet: eth0
-- ==============================================================================

conky.config = {
    -- Window Positioning & Dimensions
    alignment = 'top_right',
    gap_x = 18,
    gap_y = 18,
    minimum_width = 385,
    maximum_width = 385,
    minimum_height = 1020,
    
    -- X11 Window Integration & Compositing
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 228,       -- Translucent dark glass (~90% opacity)
    own_window_colour = '#090d16',     -- Deep Obsidian Slate background

    -- Double Buffering & Sampling
    double_buffer = true,
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,

    -- Borders & Padding
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    border_width = 0,
    border_inner_margin = 16,
    border_outer_margin = 0,
    show_graph_range = false,
    show_graph_scale = false,

    -- Typography & Rendering
    use_xft = true,
    font = 'DejaVu Sans:size=9.5',
    extra_newline = false,
    uppercase = false,
    use_spacer = 'none',

    -- Curated Modern Color Scheme
    default_color = '#F1F5F9',         -- Base Crisp White
    color0 = '#38BDF8',                -- Electric Cyan: Headers & Primary Indicators
    color1 = '#94A3B8',                -- Cool Slate: Descriptive Labels & Units
    color2 = '#34D399',                -- Emerald Mint: Available RAM, Health, Success
    color3 = '#A78BFA',                -- Soft Lavender: Secondary metrics & Storage
    color4 = '#FB923C',                -- Warm Amber: Warnings, Used RAM, Temperatures
    color5 = '#F8FAFC',                -- Pure White: Numerical Highlights
    color6 = '#1E293B',                -- Subtle Border / Track Dark Tone
}

conky.text = [[
${color0}${font DejaVu Sans:bold:size=12}◆ SYSTEM OVERVIEW ${hr 1}${font}
${color1}Host:${color5} ${nodename}${alignr}${color1}Kernel:${color5} ${kernel}
${color1}Uptime:${color5} ${uptime}${alignr}${color1}Arch:${color5} ${machine}

${color0}${font DejaVu Sans:bold:size=10.5}⚡ POWER & BATTERY (BAT1) ${hr 1}${font}
${color1}Status:${alignr}${color5}${battery_status BAT1} ${color1}(AC: ${acpiacadapter ACAD})
${color1}Charge Level:${alignr}${color2}${battery_percent BAT1}%
${color2}${battery_bar 6,385 BAT1}
${color1}Estimated Remaining:${alignr}${color5}${battery_time BAT1}
${color1}Power Draw:${alignr}${color3}${execi 5 awk '{c=$1} END{getline < "/sys/class/power_supply/BAT1/voltage_now"; printf "%.2f W", (c*$1)/10^12}' /sys/class/power_supply/BAT1/current_now 2>/dev/null}
${color1}Battery Health:${alignr}${color2}${execi 60 awk '{f=$1} END{getline < "/sys/class/power_supply/BAT1/charge_full_design"; printf "%.1f%% of design capacity", (f/$1)*100}' /sys/class/power_supply/BAT1/charge_full 2>/dev/null}

${color0}${font DejaVu Sans:bold:size=10.5}■ MEMORY (AVAILABLE vs FREE) ${hr 1}${font}
${color1}RAM Used:${alignr}${color4}${mem} / ${memmax} (${memperc}%)
${color4}${membar 6,385}
${color1}RAM Available (Apps):${alignr}${color2}${memavail} / ${memmax} (${execi 2 awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf "%.1f%%", (a/t)*100}' /proc/meminfo})
${color2}${execibar 2 6,385 awk '/MemTotal/{t=$2} /MemAvailable/{a=$2} END{printf "%.0f", (a/t)*100}' /proc/meminfo}
${color1}RAM Free (Unallocated):${alignr}${color5}${memfree}
${color1}Cache & Buffers:${alignr}${color1}Cached: ${color5}${cached} ${color1}| Buffers: ${color5}${buffers}
${color1}Swap Space:${alignr}${color5}${swap} / ${swapmax} (${swapperc}%)
${color3}${swapbar 5,385}

${color0}${font DejaVu Sans:bold:size=10.5}▲ CPU LOAD & CORES (8T) ${hr 1}${font}
${color1}Overall CPU:${color5} ${cpu cpu0}% @ ${freq_g} GHz${alignr}${color1}Load: ${color5}${loadavg 1} ${loadavg 2} ${loadavg 3}
${color0}${cpugraph cpu0 26,385 38BDF8 FB923C -l}
${color1}C1: ${color5}${cpu cpu1}% ${color0}${cpubar cpu1 5,52}${goto 205}${color1}C2: ${color5}${cpu cpu2}% ${color0}${cpubar cpu2 5,52}\n${color1}C3: ${color5}${cpu cpu3}% ${color0}${cpubar cpu3 5,52}${goto 205}${color1}C4: ${color5}${cpu cpu4}% ${color0}${cpubar cpu4 5,52}\n${color1}C5: ${color5}${cpu cpu5}% ${color0}${cpubar cpu5 5,52}${goto 205}${color1}C6: ${color5}${cpu cpu6}% ${color0}${cpubar cpu6 5,52}\n${color1}C7: ${color5}${cpu cpu7}% ${color0}${cpubar cpu7 5,52}${goto 205}${color1}C8: ${color5}${cpu cpu8}% ${color0}${cpubar cpu8 5,52}\n
${color0}${font DejaVu Sans:bold:size=10.5}▼ HARDWARE TEMPERATURES ${hr 1}${font}
${color1}CPU Package:${alignr}${color4}${hwmon coretemp temp 1}°C
${color1}Individual Cores:${alignr}${color5}${hwmon coretemp temp 2}°C ${color1}|${color5} ${hwmon coretemp temp 3}°C ${color1}|${color5} ${hwmon coretemp temp 4}°C ${color1}|${color5} ${hwmon coretemp temp 5}°C
${color1}NVMe SSD:${alignr}${color5}${hwmon nvme temp 1}°C
${color1}Motherboard Chipset:${alignr}${color5}${hwmon acpitz temp 1}°C
${color1}WiFi Chip:${alignr}${color5}${hwmon ath10k_hwmon temp 1}°C

${color0}${font DejaVu Sans:bold:size=10.5}◆ STORAGE & DISK I/O ${hr 1}${font}
${color1}Root (/):${alignr}${color5}${fs_used /} / ${fs_size /} (${fs_used_perc /}%)
${color3}${fs_bar 6,385 /}
${color1}Available Space:${alignr}${color2}${fs_free /} free
${color1}Disk Read:${color2} ${diskio_read}/s${alignr}${color1}Disk Write:${color4} ${diskio_write}/s
${color3}${diskiograph 22,385 A78BFA 38BDF8 -l}

${color0}${font DejaVu Sans:bold:size=10.5}▲ NETWORK ACTIVITY ${hr 1}${font}
${color1}WiFi (wlan0):${alignr}${color5}${addr wlan0}
${color1}Signal Quality:${alignr}${color2}${wireless_link_qual_perc wlan0}%
${color1}Download:${color2} ${downspeed wlan0}/s${alignr}${color1}Total Down:${color5} ${totaldown wlan0}
${color2}${downspeedgraph wlan0 22,385 059669 34D399 -l}
${color1}Upload:${color3} ${upspeed wlan0}/s${alignr}${color1}Total Up:${color5} ${totalup wlan0}
${color3}${upspeedgraph wlan0 22,385 7C3AED A78BFA -l}

${color0}${font DejaVu Sans:bold:size=10.5}● TOP MEMORY CONSUMERS (ACTIONABLE) ${hr 1}${font}
${font DejaVu Sans Mono:size=8.5}${color1}NAME             PID     MEM%       RES
${color5}${top_mem name 1} ${top_mem pid 1}  ${top_mem mem 1}%  ${alignr}${top_mem mem_res 1}
${color5}${top_mem name 2} ${top_mem pid 2}  ${top_mem mem 2}%  ${alignr}${top_mem mem_res 2}
${color5}${top_mem name 3} ${top_mem pid 3}  ${top_mem mem 3}%  ${alignr}${top_mem mem_res 3}
${color5}${top_mem name 4} ${top_mem pid 4}  ${top_mem mem 4}%  ${alignr}${top_mem mem_res 4}

${font DejaVu Sans:bold:size=10.5}${color0}● TOP CPU PROCESSES ${hr 1}${font}
${font DejaVu Sans Mono:size=8.5}${color1}NAME             PID     CPU%      MEM%
${color5}${top name 1} ${top pid 1}  ${top cpu 1}%  ${alignr}${top mem 1}%
${color5}${top name 2} ${top pid 2}  ${top cpu 2}%  ${alignr}${top mem 2}%
${color5}${top name 3} ${top pid 3}  ${top cpu 3}%  ${alignr}${top mem 3}%
${color5}${top name 4} ${top pid 4}  ${top cpu 4}%  ${alignr}${top mem 4}
${font}]]
