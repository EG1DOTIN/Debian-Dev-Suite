<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Crisp White Container Base -->
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Quite Visible Top-Left Debian Crimson/Rose Shade -->
    <radialGradient id="redGlow" cx="0%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Quite Visible Bottom-Right Sapphire Blue Shade -->
    <radialGradient id="blueGlow" cx="100%" cy="100%" r="85%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.40" />
      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.24" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Rim Metallic Gradient (Debian Crimson to Sapphire Blue) -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Debian Crimson Red Chevron -->
    <linearGradient id="redChevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Sapphire Blue Cursor -->
    <linearGradient id="blueCursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Toggle Track Gradient -->
    <linearGradient id="toggleTrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Card Elevation Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>

    <!-- Knob Drop Shadow Filter -->
    <filter id="knobShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Outer White Squircle Base -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#whiteCard)" filter="url(#shadow)" />

  <!-- 2. Inner Terminal Window Canvas -->
  <rect x="28" y="28" width="200" height="200" rx="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- 3. Prominent Red (Top-Left) and Blue (Bottom-Right) Shading Overlays -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#redGlow)" />
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#blueGlow)" />

  <!-- 4. Defined Outer Rim Border -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="none" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- 5. Terminal Header Divider Line -->
  <line x1="28" y1="70" x2="228" y2="70" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 6. Window Header Traffic Lights -->
  <circle cx="52" cy="49" r="6" fill="#f43f5e" />
  <circle cx="70" cy="49" r="6" fill="#fbbf24" />
  <circle cx="88" cy="49" r="6" fill="#10b981" />

  <!-- 7. Terminal Header Title Pill -->
  <rect x="150" y="45" width="58" height="8" rx="4" fill="#94a3b8" opacity="0.4" />

  <!-- 8. Central Terminal Prompt Elements (> _) -->
  <path d="M 60 108 L 94 136 L 60 164" 
        fill="none" stroke="url(#redChevron)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="112" y="150" width="44" height="14" rx="5" fill="url(#blueCursor)" />

  <!-- 9. Bottom Control Rails (GUI Manager Active Switch & Diagnostics) -->
  <g transform="translate(58, 189)">
    <rect x="0" y="0" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="0" y="0" width="56" height="20" rx="10" fill="url(#toggleTrack)" />
    <circle cx="54" cy="10" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#knobShadow)" />

    <circle cx="112" cy="10" r="6" fill="#10b981" />
    <circle cx="129" cy="10" r="6" fill="#0284c7" />
    <circle cx="146" cy="10" r="6" fill="#e11d48" />
  </g>
</svg>